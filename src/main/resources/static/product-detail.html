<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">商品详情 - 京里多多</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .product-gallery {
            position: sticky;
            top: 20px;
        }
        .main-image {
            width: 100%;
            height: 400px;
            object-fit: contain;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
        }
        .thumbnail.active {
            border-color: #007bff;
        }
        .spec-option {
            display: inline-block;
            padding: 8px 16px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .spec-option:hover {
            border-color: #007bff;
        }
        .spec-option.selected {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .spec-option.disabled {
            background-color: #f8f9fa;
            color: #6c757d;
            cursor: not-allowed;
            border-color: #dee2e6;
        }
        .price-section {
            background: #fff2f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .current-price {
            color: #e4393c;
            font-size: 2em;
            font-weight: bold;
        }
        .original-price {
            color: #999;
            text-decoration: line-through;
            margin-left: 10px;
        }
        .action-buttons {
            margin-top: 20px;
        }
        .quantity-selector {
            width: 120px;
        }
        .stock-info {
            color: #666;
            margin-bottom: 10px;
        }
        .detail-tabs {
            margin-top: 40px;
        }
        .spec-table {
            width: 100%;
            border-collapse: collapse;
        }
        .spec-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .spec-name {
            width: 120px;
            color: #666;
            background: #fafafa;
        }
        .loading-spinner {
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="product-list.html">电商平台</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="cart.html">购物车</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- 面包屑导航 -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb" id="breadcrumb">
            <li class="breadcrumb-item"><a href="product-list.html">首页</a></li>
            <!-- 动态加载分类路径 -->
        </ol>
    </nav>

    <!-- 加载状态 -->
    <div id="loading" class="loading-spinner">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
        <p class="mt-2">正在加载商品详情...</p>
    </div>

    <!-- 商品内容区域 -->
    <div id="productContent" style="display: none;">
        <div class="row">
            <!-- 商品图片 -->
            <div class="col-md-6">
                <div class="product-gallery">
                    <img id="mainImage" class="main-image" src="" alt="商品主图">
                    <div id="thumbnailList" class="d-flex flex-wrap">
                        <!-- 缩略图动态加载 -->
                    </div>
                </div>
            </div>

            <!-- 商品信息 -->
            <div class="col-md-6">
                <h1 id="productTitle" class="mb-2"></h1>
                <p id="productSubTitle" class="text-muted mb-3"></p>

                <!-- 价格区域 -->
                <div class="price-section">
                    <div class="current-price">
                        <span id="currentPrice">¥0</span>
                        <span id="originalPrice" class="original-price"></span>
                    </div>
                    <div class="stock-info">
                        库存：<span id="stockCount">0</span> 件
                    </div>
                </div>

                <!-- 规格选择 -->
                <div id="specSelection">
                    <!-- 规格选项动态生成 -->
                </div>

                <!-- 购买数量 -->
                <div class="mb-3">
                    <label class="form-label">购买数量</label>
                    <div class="d-flex align-items-center">
                        <button class="btn btn-outline-secondary" onclick="decreaseQuantity()">-</button>
                        <input type="number" class="form-control text-center mx-2 quantity-selector"
                               id="quantity" value="1" min="1" max="999" onchange="validateQuantity()">
                        <button class="btn btn-outline-secondary" onclick="increaseQuantity()">+</button>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="action-buttons">
                    <button class="btn btn-danger btn-lg me-2" onclick="addToCart()">
                        <i class="bi bi-cart-plus"></i> 加入购物车
                    </button>
                    <button class="btn btn-warning btn-lg" onclick="buyNow()">
                        <i class="bi bi-lightning"></i> 立即购买
                    </button>
                </div>

                <!-- 服务承诺 -->
                <div class="mt-4">
                    <small class="text-muted">
                        <i class="bi bi-check-circle"></i> 正品保证 &nbsp;
                        <i class="bi bi-check-circle"></i> 七天无理由退货 &nbsp;
                        <i class="bi bi-check-circle"></i> 快速发货
                    </small>
                </div>
            </div>
        </div>

        <!-- 商品详情标签页 -->
        <div class="detail-tabs">
            <ul class="nav nav-tabs" id="detailTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="description-tab" data-bs-toggle="tab"
                            data-bs-target="#description" type="button" role="tab">商品详情</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="specs-tab" data-bs-toggle="tab"
                            data-bs-target="#specs" type="button" role="tab">规格参数</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="packing-tab" data-bs-toggle="tab"
                            data-bs-target="#packing" type="button" role="tab">包装清单</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="service-tab" data-bs-toggle="tab"
                            data-bs-target="#service" type="button" role="tab">售后服务</button>
                </li>
            </ul>
            <div class="tab-content p-3 border border-top-0 rounded-bottom">
                <div class="tab-pane fade show active" id="description" role="tabpanel">
                    <div id="productDescription">
                        <!-- 商品描述内容 -->
                    </div>
                </div>
                <div class="tab-pane fade" id="specs" role="tabpanel">
                    <table class="spec-table" id="specTable">
                        <!-- 规格参数表格 -->
                    </table>
                </div>
                <div class="tab-pane fade" id="packing" role="tabpanel">
                    <div id="packingList">
                        <!-- 包装清单 -->
                    </div>
                </div>
                <div class="tab-pane fade" id="service" role="tabpanel">
                    <div id="afterService">
                        <!-- 售后服务 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 全局变量
    let productData = null;
    let selectedSku = null;
    let selectedSpecs = {};
    let quantity = 1;

    // API基础URL - 根据您的实际后端地址修改
    const API_BASE_URL = 'http://localhost:8080/api';

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (productId) {
            loadProductDetail(productId);
        } else {
            showError('商品ID参数缺失');
        }
    });

    // 加载商品详情
    async function loadProductDetail(productId) {
        showLoading(true);

        try {
            const response = await fetch(`${API_BASE_URL}/products/${productId}`);
            const data = await response.json();

            if (data.success) {
                productData = data.data;
                displayProductDetail();
                initializeSpecSelection();
                document.getElementById('productContent').style.display = 'block';
            } else {
                showError('加载商品详情失败：' + data.message);
            }
        } catch (error) {
            console.error('加载商品详情错误:', error);
            showError('网络错误：' + error.message);
        } finally {
            showLoading(false);
        }
    }

    // 显示商品详情
    function displayProductDetail() {
        const { spuInfo, spuDetail, skus } = productData;

        // 设置页面标题
        document.title = `${spuInfo.title} - 电商平台`;
        document.getElementById('pageTitle').textContent = spuInfo.title;

        // 设置商品基本信息
        document.getElementById('productTitle').textContent = spuInfo.title;
        document.getElementById('productSubTitle').textContent = spuInfo.subTitle || '';

        // 设置面包屑导航
        updateBreadcrumb(spuInfo);

        // 设置商品图片
        if (skus && skus.length > 0) {
            const firstSku = skus[0];
            updateProductImages(firstSku.images);
        }

        // 设置商品详情内容
        document.getElementById('productDescription').innerHTML = spuDetail.description || '暂无商品描述';
        document.getElementById('packingList').textContent = spuDetail.packingList || '暂无包装清单信息';
        document.getElementById('afterService').textContent = spuDetail.afterService || '暂无售后服务信息';

        // 设置规格参数表格
        updateSpecTable(spuDetail);
    }

    // 初始化规格选择
    function initializeSpecSelection() {
        const { spuDetail, skus } = productData;

        // 解析特有规格
        let specialSpec = {};
        try {
            specialSpec = JSON.parse(spuDetail.specialSpec || '{}');
        } catch (e) {
            console.error('解析规格参数错误:', e);
        }

        const specContainer = document.getElementById('specSelection');

        specContainer.innerHTML = Object.entries(specialSpec).map(([specName, specValues]) => `
                <div class="mb-3">
                    <label class="form-label">${specName}</label>
                    <div>
                        ${specValues.map(value => `
                            <span class="spec-option"
                                  data-spec="${specName}"
                                  data-value="${value}"
                                  onclick="selectSpec('${specName}', '${value}')">
                                ${value}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `).join('');

        // 默认选择第一个SKU
        if (skus && skus.length > 0) {
            selectSku(skus[0]);
        }
    }

    // 选择规格
    async function selectSpec(specName, specValue) {
        // 更新选择的规格
        selectedSpecs[specName] = specValue;

        // 更新UI显示
        document.querySelectorAll(`[data-spec="${specName}"]`).forEach(option => {
            option.classList.remove('selected');
            if (option.getAttribute('data-value') === specValue) {
                option.classList.add('selected');
            }
        });

        // 调用API查找匹配的SKU
        try {
            const response = await fetch(`${API_BASE_URL}/products/${productData.spuInfo.id}/sku`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(selectedSpecs)
            });

            const data = await response.json();

            if (data.success) {
                selectSku(data.data.sku, data.data.stock);
            } else {
                // 如果没有完全匹配的SKU，更新规格可用性
                updateSpecAvailability();
            }
        } catch (error) {
            console.error('查找SKU失败：', error);
            updateSpecAvailability();
        }
    }

    // 更新规格可用性
    function updateSpecAvailability() {
        const { skus } = productData;
        const availableCombinations = new Set();

        // 收集所有可用的规格组合
        skus.forEach(sku => {
            if (sku.enable && sku.stock > 0) {
                try {
                    const ownSpec = JSON.parse(sku.ownSpec || '{}');
                    Object.entries(ownSpec).forEach(([specName, specValue]) => {
                        availableCombinations.add(`${specName}:${specValue}`);
                    });
                } catch (e) {
                    console.error('解析SKU规格错误:', e);
                }
            }
        });

        // 更新规格选项状态
        document.querySelectorAll('.spec-option').forEach(option => {
            const specName = option.getAttribute('data-spec');
            const specValue = option.getAttribute('data-value');
            const isAvailable = availableCombinations.has(`${specName}:${specValue}`);

            option.classList.toggle('disabled', !isAvailable);
        });
    }

    // 选择SKU
    function selectSku(sku, stock) {
        selectedSku = sku;

        // 更新价格和库存
        document.getElementById('currentPrice').textContent = `¥${formatPrice(sku.price)}`;
        document.getElementById('stockCount').textContent = stock ? stock.stock : 0;

        // 更新商品图片
        updateProductImages(sku.images);

        // 更新数量选择器的最大值
        const maxQuantity = stock ? Math.min(stock.stock, 999) : 1;
        document.getElementById('quantity').max = maxQuantity;

        // 解析并显示规格
        try {
            const ownSpec = JSON.parse(sku.ownSpec || '{}');
            selectedSpecs = { ...ownSpec };

            // 更新规格选择UI
            Object.entries(ownSpec).forEach(([specName, specValue]) => {
                document.querySelectorAll(`[data-spec="${specName}"]`).forEach(option => {
                    option.classList.remove('selected');
                    if (option.getAttribute('data-value') === specValue) {
                        option.classList.add('selected');
                    }
                });
            });
        } catch (e) {
            console.error('解析SKU规格错误:', e);
        }
    }

    // 更新商品图片
    function updateProductImages(images) {
        if (!images || images.length === 0) {
            images = ['/images/placeholder.jpg'];
        }

        const mainImage = document.getElementById('mainImage');
        const thumbnailList = document.getElementById('thumbnailList');

        // 设置主图
        mainImage.src = images[0];
        mainImage.alt = productData.spuInfo.title;

        // 设置缩略图
        thumbnailList.innerHTML = images.map((image, index) => `
                <img src="${image}"
                     class="thumbnail ${index === 0 ? 'active' : ''}"
                     alt="商品图片 ${index + 1}"
                     onclick="changeMainImage('${image}', this)"
                     onerror="this.src='/images/placeholder.jpg'">
            `).join('');
    }

    // 切换主图
    function changeMainImage(imageUrl, element) {
        document.getElementById('mainImage').src = imageUrl;

        // 更新缩略图激活状态
        document.querySelectorAll('.thumbnail').forEach(thumb => {
            thumb.classList.remove('active');
        });
        element.classList.add('active');
    }

    // 更新规格参数表格
    function updateSpecTable(spuDetail) {
        const specTable = document.getElementById('specTable');

        // 解析通用规格
        let genericSpec = {};
        try {
            genericSpec = JSON.parse(spuDetail.genericSpec || '{}');
        } catch (e) {
            console.error('解析通用规格错误:', e);
        }

        specTable.innerHTML = Object.entries(genericSpec).map(([name, value]) => `
                <tr>
                    <td class="spec-name">${name}</td>
                    <td>${value}</td>
                </tr>
            `).join('');
    }

    // 更新面包屑导航
    function updateBreadcrumb(spuInfo) {
        // 这里需要根据分类ID加载分类路径
        // 简化实现，直接显示商品标题
        const breadcrumb = document.getElementById('breadcrumb');
        breadcrumb.innerHTML = `
                <li class="breadcrumb-item"><a href="product-list.html">首页</a></li>
                <li class="breadcrumb-item active">${spuInfo.title}</li>
            `;
    }

    // 增加数量
    function increaseQuantity() {
        const quantityInput = document.getElementById('quantity');
        let current = parseInt(quantityInput.value);

        if (current < parseInt(quantityInput.max)) {
            quantityInput.value = current + 1;
            quantity = quantityInput.value;
        }
    }

    // 减少数量
    function decreaseQuantity() {
        const quantityInput = document.getElementById('quantity');
        let current = parseInt(quantityInput.value);

        if (current > 1) {
            quantityInput.value = current - 1;
            quantity = quantityInput.value;
        }
    }

    // 验证数量
    function validateQuantity() {
        const quantityInput = document.getElementById('quantity');
        let value = parseInt(quantityInput.value);

        if (isNaN(value) || value < 1) {
            quantityInput.value = 1;
        } else if (value > parseInt(quantityInput.max)) {
            quantityInput.value = quantityInput.max;
        }

        quantity = quantityInput.value;
    }

    // 加入购物车
    async function addToCart() {
        if (!selectedSku) {
            showError('请选择商品规格');
            return;
        }

        // 检查库存
        try {
            const stockCheckResponse = await fetch(`${API_BASE_URL}/products/${selectedSku.id}/stock?quantity=${quantity}`);
            const stockCheckData = await stockCheckResponse.json();

            if (!stockCheckData.success || !stockCheckData.data) {
                showError('库存不足');
                return;
            }

            const response = await fetch(`${API_BASE_URL}/cart/add`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    skuId: selectedSku.id,
                    quantity: parseInt(quantity)
                })
            });

            const data = await response.json();

            if (data.success) {
                showSuccess('商品已成功加入购物车');
            } else {
                showError('加入购物车失败：' + data.message);
            }
        } catch (error) {
            console.error('加入购物车错误:', error);
            showError('网络错误：' + error.message);
        }
    }

    // 立即购买
    function buyNow() {
        if (!selectedSku) {
            showError('请选择商品规格');
            return;
        }

        // 跳转到确认订单页面
        window.location.href = `order-confirm.html?skuId=${selectedSku.id}&quantity=${quantity}`;
    }

    // 价格格式化（分转元）
    function formatPrice(priceInFen) {
        if (!priceInFen) return '0.00';
        return (priceInFen / 100).toFixed(2);
    }

    // 显示加载状态
    function showLoading(show) {
        document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    // 显示错误信息
    function showError(message) {
        alert('错误: ' + message);
    }

    // 显示成功信息
    function showSuccess(message) {
        alert('成功: ' + message);
    }

    <!-- 在页面底部引入JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/product-detail.js"></script>

</script>
</body>
</html>
