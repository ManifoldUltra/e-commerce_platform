<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表 - 京里多多</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .product-card {
            transition: transform 0.2s;
            margin-bottom: 20px;
            height: 100%;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .price-range {
            color: #e4393c;
            font-weight: bold;
            font-size: 1.2em;
        }
        .filter-sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }
        .product-image {
            height: 200px;
            object-fit: cover;
        }
        .pagination {
            justify-content: center;
            margin-top: 30px;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="#">电商平台</a>
        <!-- 搜索框 -->
        <div class="d-flex mx-auto" style="width: 50%;">
            <input class="form-control me-2" type="search" id="searchInput" placeholder="搜索商品...">
            <button class="btn btn-outline-success" onclick="searchProducts()">搜索</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <!-- 侧边栏筛选 -->
        <div class="col-md-3">
            <div class="filter-sidebar">
                <h5>商品筛选</h5>

                <!-- 分类筛选 -->
                <div class="mb-3">
                    <label class="form-label">商品分类</label>
                    <select class="form-select" id="categoryFilter" onchange="filterProducts()">
                        <option value="">全部分类</option>
                        <!-- 动态加载分类 -->
                    </select>
                </div>

                <!-- 品牌筛选 -->
                <div class="mb-3">
                    <label class="form-label">品牌</label>
                    <select class="form-select" id="brandFilter" onchange="filterProducts()">
                        <option value="">全部品牌</option>
                        <!-- 动态加载品牌 -->
                    </select>
                </div>

                <!-- 重置按钮 -->
                <button class="btn btn-outline-secondary w-100" onclick="resetFilters()">重置筛选</button>
            </div>
        </div>

        <!-- 商品列表 -->
        <div class="col-md-9">
            <!-- 排序选项 -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <span id="productCount">共 0 件商品</span>
                </div>
                <div>
                    <select class="form-select" id="sortOption" onchange="sortProducts()">
                        <option value="default">默认排序</option>
                        <option value="price_asc">价格从低到高</option>
                        <option value="price_desc">价格从高到低</option>
                        <option value="update_time">最新上架</option>
                    </select>
                </div>
            </div>

            <!-- 商品网格 -->
            <div class="row" id="productList">
                <!-- 商品卡片动态加载 -->
            </div>

            <!-- 分页 -->
            <nav>
                <ul class="pagination" id="pagination">
                    <!-- 分页按钮动态生成 -->
                </ul>
            </nav>

            <!-- 加载状态 -->
            <div id="loading" class="loading-spinner">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-2">正在加载商品...</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 全局变量
    let currentPage = 1;
    let pageSize = 12;
    let totalProducts = 0;
    let currentFilters = {};

    // API基础URL - 根据您的实际后端地址修改
    const API_BASE_URL = 'http://localhost:8080/api';

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        loadProducts();
        loadFilters();
    });

    // 加载商品列表
    async function loadProducts() {
        showLoading(true);

        try {
            const response = await fetch(buildProductListUrl());
            const data = await response.json();

            if (data.success) {
                displayProducts(data.data);
                updatePagination(data.total);
                updateProductCount(data.total);
            } else {
                showError('加载商品失败：' + data.message);
            }
        } catch (error) {
            console.error('加载商品列表错误:', error);
            showError('网络错误：' + error.message);
        } finally {
            showLoading(false);
        }
    }

    // 构建商品列表请求URL
    function buildProductListUrl() {
        const params = new URLSearchParams({
            page: currentPage,
            size: pageSize
        });

        // 添加筛选参数
        if (currentFilters.categoryId) {
            params.append('categoryId', currentFilters.categoryId);
        }
        if (currentFilters.brandId) {
            params.append('brandId', currentFilters.brandId);
        }
        if (currentFilters.keyword) {
            params.append('keyword', currentFilters.keyword);
        }

        return `${API_BASE_URL}/products/list?${params.toString()}`;
    }

    // 显示商品列表
    function displayProducts(products) {
        const container = document.getElementById('productList');

        if (!products || products.length === 0) {
            container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-search" style="font-size: 3rem; color: #ccc;"></i>
                        <p class="text-muted mt-3">没有找到符合条件的商品</p>
                    </div>
                `;
            return;
        }

        container.innerHTML = products.map(product => `
                <div class="col-lg-3 col-md-4 col-sm-6">
                    <div class="card product-card h-100">
                        <img src="${product.mainImage || '/images/placeholder.jpg'}"
                             class="card-img-top product-image"
                             alt="${product.title}"
                             onerror="this.src='/images/placeholder.jpg'">
                        <div class="card-body d-flex flex-column">
                            <h6 class="card-title">${product.title}</h6>
                            <p class="card-text text-muted small flex-grow-1">${product.subTitle || ''}</p>
                            <div class="price-range">
                                ¥${formatPrice(product.price)}
                            </div>
                            <div class="mt-2">
                                <button class="btn btn-outline-primary btn-sm w-100"
                                        onclick="viewProductDetail(${product.id})">
                                    查看详情
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
    }

    // 价格格式化（分转元）
    function formatPrice(priceInFen) {
        if (!priceInFen) return '0.00';
        return (priceInFen / 100).toFixed(2);
    }

    // 更新分页
    function updatePagination(total) {
        const totalPages = Math.ceil(total / pageSize);
        const pagination = document.getElementById('pagination');

        let html = '';

        // 上一页
        html += `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">上一页</a>
                </li>
            `;

        // 页码
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                html += `
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                        </li>
                    `;
            } else if (i === currentPage - 3 || i === currentPage + 3) {
                html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }
        }

        // 下一页
        html += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">下一页</a>
                </li>
            `;

        pagination.innerHTML = html;
    }

    // 切换页码
    function changePage(page) {
        if (page < 1 || page > Math.ceil(totalProducts / pageSize)) return;

        currentPage = page;
        loadProducts();
        window.scrollTo(0, 0);
    }

    // 筛选商品
    function filterProducts() {
        currentPage = 1;

        currentFilters = {
            categoryId: document.getElementById('categoryFilter').value,
            brandId: document.getElementById('brandFilter').value,
            keyword: document.getElementById('searchInput').value
        };

        // 移除空值
        Object.keys(currentFilters).forEach(key => {
            if (!currentFilters[key]) delete currentFilters[key];
        });

        loadProducts();
    }

    // 搜索商品
    function searchProducts() {
        currentFilters.keyword = document.getElementById('searchInput').value;
        filterProducts();
    }

    // 排序商品
    function sortProducts() {
        currentFilters.sort = document.getElementById('sortOption').value;
        loadProducts();
    }

    // 重置筛选
    function resetFilters() {
        document.getElementById('categoryFilter').value = '';
        document.getElementById('brandFilter').value = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('sortOption').value = 'default';

        currentFilters = {};
        loadProducts();
    }

    // 加载筛选条件
    async function loadFilters() {
        try {
            // 加载分类
            const categoryResponse = await fetch(`${API_BASE_URL}/categories`);
            const categoryData = await categoryResponse.json();

            if (categoryData.success) {
                const categorySelect = document.getElementById('categoryFilter');
                categorySelect.innerHTML = '<option value="">全部分类</option>' +
                    categoryData.data.map(cat =>
                        `<option value="${cat.id}">${cat.name}</option>`
                    ).join('');
            }

            // 加载品牌
            const brandResponse = await fetch(`${API_BASE_URL}/brands`);
            const brandData = await brandResponse.json();

            if (brandData.success) {
                const brandSelect = document.getElementById('brandFilter');
                brandSelect.innerHTML = '<option value="">全部品牌</option>' +
                    brandData.data.map(brand =>
                        `<option value="${brand.id}">${brand.name}</option>`
                    ).join('');
            }
        } catch (error) {
            console.error('加载筛选条件失败：', error);
        }
    }

    // 查看商品详情
    function viewProductDetail(productId) {
        window.location.href = `product-detail.html?id=${productId}`;
    }

    // 显示/隐藏加载状态
    function showLoading(show) {
        document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    // 显示错误信息
    function showError(message) {
        // 可以使用Toast或Alert显示错误信息
        alert(message);
    }

    // 更新商品数量显示
    function updateProductCount(total) {
        document.getElementById('productCount').textContent = `共 ${total} 件商品`;
    }

    <!-- 在页面底部引入JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/product-list.js"></script>

</script>
</body>
</html>
